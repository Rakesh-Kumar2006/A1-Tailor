<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | A-1 Tailor</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">

    <!-- Shared site renderer (nav/footer + shared data) -->
    <script src="assets/js/site.js" defer></script>
</head>
<body>

<div class="container mt-3 site-data-warning" id="site-data-warning" style="display:none;">
    This site uses shared data from <code>assets/data/site.json</code>. If you opened the HTML via <code>file://</code>,
    some browsers block JSON loading. Run a local server (or use Live Server) for best results.
</div>

<div id="site-nav"></div>
<noscript>
    <div class="container mt-3">
        <div class="alert alert-warning">JavaScript is required to render the navigation and footer on this site.</div>
    </div>
</noscript>

<!-- Page Banner -->
<section class="py-5 text-center bg-dark text-white">
    <div class="container">
        <h1>Contact Us</h1>
        <p>Get in touch to book an appointment or ask a question</p>
    </div>
</section>

<!-- Contact Form -->
<section class="py-5">
    <div class="container">
        <div class="row">
            <div class="col-md-6">
                <h3>Send Us A Message</h3>
                <form id="contactForm">
                    <div class="mb-3">
                        <label for="name" class="form-label">Name</label>
                        <input type="text" class="form-control" id="name" required>
                    </div>
                    <div class="mb-3">
                        <label for="phone" class="form-label">Phone</label>
                        <input type="tel" class="form-control" id="phone" required>
                    </div>
                    <div class="mb-3">
                        <label for="message" class="form-label">Message</label>
                        <textarea class="form-control" id="message" rows="5" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-custom">Send Message</button>
                </form>
                <div id="formAlert" class="mt-3" style="display:none;"></div>
            </div>
            <div class="col-md-6" id="contact-info"></div>
        </div>
    </div>
</section>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/contact.js"></script>
</body>
</html>
